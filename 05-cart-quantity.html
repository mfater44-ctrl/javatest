    <button onclick="

      console.log (`Cart quanity: ${cartQuanity} `);
    ">Add to Cart</button>

    <button onclick="
      cartQuanity += 2;
      console.log (`Cart quanity: ${cartQuanity} `);
    "> +2 </button>

    <button onclick="
      cartQuanity += 3;
      console.log (`Cart quanity: ${cartQuanity} `);
    ">+3</button>

    <button onclick="
      cartQuanity += 4;
      console.log (`Cart quanity: ${cartQuanity} `);
    ">+4</button>

    <button onclick="
      cartQuanity += 5;
      console.log (`Cart quanity: ${cartQuanity} `);
    ">+5</button>

    <button onclick="

      ">-2</button>

    <button onclick="
        cartQuanity --;
        console.log (`Cart quanity: ${cartQuanity} `);
      ">Remove from Cart</button>

      cartQuanity = 0;
      console.log ('Cart was reset');
