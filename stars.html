<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stars collector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background-color: #1e293b;
    }
    .instructions {
      margin-top: 15px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>
  <p class="instructions">Use the arrow keys ➔  to move. Press R to restart after losing.</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // إعدادات اللاعب
    const player = {
      width: 40,
      height: 40,
      x: canvas.width / 2 - 20,
      y: canvas.height - 60,
      speed: 8,
      dx: 0
    };

    // إعدادات النجمة
    const star = {
      size: 20,
      x: Math.random() * (canvas.width - 20),
      y: -20,
      speed: 4
    };

    // إعدادات العقبة (الشهاب)
    const obstacle = {
      size: 30,
      x: Math.random() * (canvas.width - 30),
      y: -30,
      speed: 6
    };

    let score = 0;
    let gameOver = false;
    const keys = {};

    // الاستجابة لمفاتيح لوحة التحكم
    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (gameOver && (e.code === "KeyR" || e.code === "Arabic_rasa")) {
        resetGame();
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    function resetGame() {
      score = 0;
      gameOver = false;
      player.x = canvas.width / 2 - player.width / 2;
      star.y = -star.size;
      star.x = Math.random() * (canvas.width - star.size);
      star.speed = 4;
      obstacle.y = -obstacle.size;
      obstacle.x = Math.random() * (canvas.width - obstacle.size);
      obstacle.speed = 6;
      requestAnimationFrame(update);
    }

    function movePlayer() {
      if (keys["ArrowLeft"] && player.x > 0) {
        player.x -= player.speed;
      }
      if (keys["ArrowRight"] && player.x < canvas.width - player.width) {
        player.x += player.speed;
      }
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = "#fde047";
      ctx.fill();
    }

    function update() {
      if (gameOver) return;

      movePlayer();

      // تحريك النجمة والعقبة
      star.y += star.speed;
      obstacle.y += obstacle.speed;

      // إعادة النجمة عند الخروج
      if (star.y > canvas.height) {
        star.y = -star.size;
        star.x = Math.random() * (canvas.width - star.size);
      }

      // إعادة العقبة عند الخروج
      if (obstacle.y > canvas.height) {
        obstacle.y = -obstacle.size;
        obstacle.x = Math.random() * (canvas.width - obstacle.size);
      }

      // فحص الاصطدام بالنجمة
      if (
        player.x < star.x + star.size &&
        player.x + player.width > star.x &&
        player.y < star.y + star.size &&
        player.y + player.height > star.y
      ) {
        score += 10;
        star.y = -star.size;
        star.x = Math.random() * (canvas.width - star.size);

        // زيادة الصعوبة تدريجياً
        if (score % 50 === 0) {
          obstacle.speed += 1;
          star.speed += 0.5;
        }
      }

      // فحص الاصطدام بالعقبة
      if (
        player.x < obstacle.x + obstacle.size &&
        player.x + player.width > obstacle.x &&
        player.y < obstacle.y + obstacle.size &&
        player.y + player.height > obstacle.y
      ) {
        gameOver = true;
      }

      draw();

      if (!gameOver) {
        requestAnimationFrame(update);
      } else {
        drawGameOver();
      }
    }

    function draw() {
      // تنظيف الشاشة
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // رسم اللاعب (مربع ذهبي)
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.width, player.height, 8);
      ctx.fill();

      // رسم النجمة
      drawStar(star.x + star.size / 2, star.y + star.size / 2, 5, star.size, star.size / 2);

      // رسم العقبة (شهاب أحمر)
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(obstacle.x + obstacle.size / 2, obstacle.y + obstacle.size / 2, obstacle.size / 2, 0, Math.PI * 2);
      ctx.fill();

      // عرض النتيجة
      ctx.fillStyle = "#ffffff";
      ctx.font = "20px system-ui";
      ctx.fillText(`النتيجة: ${score}`, 20, 35);
    }

    function drawGameOver() {
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.font = "bold 36px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 20);

      ctx.fillStyle = "#ffffff";
      ctx.font = "20px system-ui";
      ctx.fillText(`مجموع نقاطك: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
      ctx.fillText("اضغط R لإعادة اللعب", canvas.width / 2, canvas.height / 2 + 70);
      ctx.textAlign = "right"; // إعادة ضبط المحاذاة
    }

    // بدء اللعبة
    requestAnimationFrame(update);
  </script>
</body>
</html>
